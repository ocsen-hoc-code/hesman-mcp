<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Hesman</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/views.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="shell">
      <header class="rail">
        <div class="brand">
          <a class="wordmark" href="#/overview">Hesman</a>
          <p class="brand-project" id="brand-project" title=""></p>
        </div>
        <nav class="nav" aria-label="Sections">
          <a href="#/overview" data-view="overview">Overview</a>
          <a href="#/metrics" data-view="metrics">Metrics</a>
          <a href="#/logs" data-view="logs">Logs</a>
          <a href="#/graph" data-view="graph">Graph</a>
          <a href="#/playground" data-view="playground">Playground</a>
        </nav>
        <div class="rail-foot">
          <p class="status-line" id="connection" role="status" data-state="pending">Connecting</p>
          <button type="button" class="btn btn-quiet" id="theme-toggle">Dark theme</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1">
        <noscript><p class="notice">This dashboard needs JavaScript. Nothing is loaded from the internet.</p></noscript>
      </main>
    </div>
  </body>
</html>
